[project]
name = "onekey"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography==42.0.8",
    "fastapi==0.141.1",
    "httpx==0.27.0",
    "openai>=2.53.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.4",
    "pyjwt==2.8.0",
    "pytest>=9.1.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.30",
    "uvicorn[standard]==0.30.1",
]

[tool.pytest.ini_options]
# asyncio_mode = "auto" tells pytest-asyncio to automatically treat
# any async test function as an asyncio test — no need to mark each one manually.
# Without this, async tests are silently collected but never run.
asyncio_mode = "auto"
testpaths = ["tests"]
